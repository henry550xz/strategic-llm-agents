<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">Strategic-agent architectures</title><desc id="desc">Direct LLM, hierarchical planner with shared five-agent IPPO, and locally trained LLM execution paths.</desc><style>:root{--text:#0f172a;--muted:#475569;--line:#94a3b8;--blue:#2563eb;--teal:#0f766e;--violet:#7c3aed;--soft:#e2e8f0}@media(prefers-color-scheme:dark){:root{--text:#f1f5f9;--muted:#cbd5e1;--line:#64748b;--blue:#60a5fa;--teal:#5eead4;--violet:#c4b5fd;--soft:#334155}}text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--text)}.title{font-size:27px;font-weight:700}.lane{font-size:17px;font-weight:700}.label{font-size:16px}.small{font-size:14px;fill:var(--muted)}.rule{stroke:var(--soft);stroke-width:1}.flow{fill:none;stroke:var(--line);stroke-width:2.2;marker-end:url(#arrow)}.plan{fill:none;stroke:var(--teal);stroke-width:2.5;marker-end:url(#arrowTeal)}.node-blue{fill:var(--blue)}.node-teal{fill:var(--teal)}.node-violet{fill:var(--violet)}.agent{fill:none;stroke:var(--teal);stroke-width:2}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--line)"/></marker><marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--teal)"/></marker></defs><text x="36" y="42" class="title">Strategic-agent architectures</text><line x1="36" y1="62" x2="1064" y2="62" class="rule"/><text x="36" y="119" class="lane">S1 · Direct policy</text><circle cx="254" cy="112" r="6" class="node-blue"/><text x="274" y="118" class="label">state + history</text><path d="M400 112H495" class="flow"/><circle cx="510" cy="112" r="6" class="node-blue"/><text x="530" y="118" class="label">API LLM</text><path d="M625 112H720" class="flow"/><circle cx="735" cy="112" r="6" class="node-blue"/><text x="755" y="118" class="label">legal action</text><line x1="36" y1="154" x2="1064" y2="154" class="rule"/><text x="36" y="209" class="lane">S2B · Learned MARL</text><circle cx="254" cy="202" r="6" class="node-teal"/><text x="274" y="208" class="label">state + history</text><path d="M400 202H495" class="plan"/><circle cx="510" cy="202" r="6" class="node-teal"/><text x="530" y="208" class="label">LLM planner</text><path d="M620 202H705" class="plan"/><circle cx="720" cy="202" r="6" class="node-teal"/><text x="740" y="208" class="label">semantic intent</text><circle cx="254" cy="282" r="6" class="node-teal"/><text x="274" y="288" class="label">decentralized observation</text><path d="M470 282H615" class="plan"/><path d="M720 214V238H630V265" class="plan"/><circle cx="630" cy="282" r="9" class="node-teal"/><text x="650" y="276" class="lane">shared actor + critic</text><text x="650" y="300" class="small">parameter-sharing IPPO · PPO + GAE</text><path d="M865 282H942" class="plan"/><g transform="translate(960 254)"><circle cx="0" cy="0" r="6" class="node-teal"/><circle cx="20" cy="14" r="6" class="node-teal"/><circle cx="0" cy="28" r="6" class="node-teal"/><circle cx="-20" cy="14" r="6" class="node-teal"/><circle cx="0" cy="14" r="6" class="node-teal"/></g><text x="1000" y="274" class="label">5 actions</text><text x="1000" y="296" class="small">sampled independently</text><line x1="36" y1="342" x2="1064" y2="342" class="rule"/><text x="36" y="405" class="lane">S3 · Local policy</text><circle cx="254" cy="398" r="6" class="node-violet"/><text x="274" y="404" class="label">state + history</text><path d="M400 398H495" class="flow"/><circle cx="510" cy="398" r="6" class="node-violet"/><text x="530" y="404" class="label">SFT / GRPO LLM</text><path d="M675 398H770" class="flow"/><circle cx="785" cy="398" r="6" class="node-violet"/><text x="805" y="404" class="label">legal action</text><text x="36" y="476" class="small">S2A uses the same planner path with a deterministic rule controller in place of shared IPPO.</text></svg>
