<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430"><style>text{font-family:Arial;fill:#172554}.h{font-size:23px;font-weight:bold}.t{font-size:14px}.axis{stroke:#64748b}.grid{stroke:#e2e8f0}.c{fill:#0f766e}.v{fill:#f97316}.r{fill:#60a5fa}</style><text x="35" y="35" class="h">Lossless context representation</text><line x1="85" y1="350" x2="750" y2="350" class="axis"/><line x1="85" y1="50" x2="85" y2="350" class="axis"/><line x1="85" y1="250" x2="750" y2="250" class="grid"/><line x1="85" y1="150" x2="750" y2="150" class="grid"/><line x1="85" y1="50" x2="750" y2="50" class="grid"/><text x="70" y="355" class="t">0</text><text x="70" y="255" class="t">2</text><text x="70" y="155" class="t">4</text><text x="70" y="55" class="t">6</text><text x="18" y="250" class="t" transform="rotate(-90 18 250)">mean regret (lower is better)</text><rect x="150" y="176" width="60" height="174" class="c"/><rect x="218" y="106" width="60" height="244" class="v"/><rect x="286" y="176" width="60" height="174" class="r"/><text x="190" y="380" class="t">discovery</text><rect x="470" y="162" width="60" height="188" class="c"/><rect x="538" y="81" width="60" height="269" class="v"/><rect x="606" y="168" width="60" height="182" class="r"/><text x="520" y="380" class="t">replication</text><rect x="200" y="400" width="15" height="15" class="c"/><text x="220" y="413" class="t">COMPACT</text><rect x="345" y="400" width="15" height="15" class="v"/><text x="365" y="413" class="t">VERBOSE</text><rect x="485" y="400" width="15" height="15" class="r"/><text x="505" y="413" class="t">REDUNDANT</text></svg>
