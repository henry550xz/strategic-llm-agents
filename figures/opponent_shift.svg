<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-label="Held-out mean and worst-opponent regret"><style>:root{--text:#0f172a;--axis:#64748b;--grid:#e2e8f0;--narrow:#64748b;--diverse:#2563eb}@media(prefers-color-scheme:dark){:root{--text:#f1f5f9;--axis:#cbd5e1;--grid:#475569;--narrow:#cbd5e1;--diverse:#60a5fa}}text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--text)}.h{font-size:23px;font-weight:700}.t{font-size:15px}.axis{stroke:var(--axis);stroke-width:1.5}.grid{stroke:var(--grid)}.n{fill:var(--narrow)}.d{fill:var(--diverse)}</style><text x="35" y="35" class="h">Held-out opponent shift</text><line x1="90" y1="350" x2="750" y2="350" class="axis"/><line x1="90" y1="70" x2="90" y2="350" class="axis"/><line x1="90" y1="225" x2="750" y2="225" class="grid"/><line x1="90" y1="100" x2="750" y2="100" class="grid"/><text x="72" y="355" class="t">0</text><text x="67" y="230" class="t">5</text><text x="60" y="105" class="t">10</text><text x="20" y="260" class="t" transform="rotate(-90 20 260)">regret (lower is better)</text><rect x="175" y="185" width="90" height="165" class="n"/><rect x="275" y="190" width="90" height="160" class="d"/><text x="188" y="380" class="t">mean</text><text x="181" y="175" class="t">6.614</text><text x="288" y="180" class="t">6.402</text><rect x="495" y="100" width="90" height="250" class="n"/><rect x="595" y="97" width="90" height="253" class="d"/><text x="500" y="380" class="t">worst opponent</text><text x="500" y="90" class="t">9.989</text><text x="600" y="87" class="t">10.128</text><rect x="530" y="25" width="16" height="16" class="n"/><text x="552" y="39" class="t">NARROW</text><rect x="650" y="25" width="16" height="16" class="d"/><text x="672" y="39" class="t">DIVERSE</text></svg>
