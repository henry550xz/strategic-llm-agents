<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" viewBox="0 0 800 410"><style>text{font-family:Arial;fill:#172554}.h{font-size:23px;font-weight:bold}.k{font-size:18px;font-weight:bold}.t{font-size:15px}.card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:14}.accent{fill:#fee2e2}.value{font-size:36px;font-weight:bold;fill:#b91c1c}.small{font-size:13px;fill:#475569}</style><text x="35" y="38" class="h">Low regret does not rule out collapse</text><rect x="55" y="75" width="320" height="245" class="card"/><rect x="425" y="75" width="320" height="245" class="card"/><text x="145" y="115" class="k">Step 100</text><text x="515" y="115" class="k">Step 200</text><text x="90" y="165" class="t">Mean regret</text><text x="245" y="165" class="k">3.173397</text><text x="460" y="165" class="t">Mean regret</text><text x="615" y="165" class="k">3.330709</text><rect x="80" y="195" width="270" height="95" class="accent"/><rect x="450" y="195" width="270" height="95" class="accent"/><text x="100" y="225" class="t">Dominant-action fraction</text><text x="165" y="270" class="value">0.965</text><text x="470" y="225" class="t">Dominant-action fraction</text><text x="535" y="270" class="value">0.989</text><text x="110" y="350" class="t">At step 200, 989 / 1,000 decisions select price 7.5.</text><text x="110" y="378" class="small">Behavioral concentration is reported separately from scalar regret.</text></svg>
