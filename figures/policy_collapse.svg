<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" viewBox="0 0 800 410" role="img" aria-label="Policy collapse despite low regret"><style>:root{--text:#0f172a;--muted:#475569;--card:#f8fafc;--border:#cbd5e1;--accent:#fffbeb;--alert:#92400e}@media(prefers-color-scheme:dark){:root{--text:#f1f5f9;--muted:#cbd5e1;--card:#111827;--border:#475569;--accent:#422006;--alert:#fbbf24}}text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--text)}.h{font-size:23px;font-weight:700}.k{font-size:18px;font-weight:700}.t{font-size:15px}.card{fill:var(--card);stroke:var(--border);stroke-width:2;rx:14}.accent{fill:var(--accent)}.value{font-size:36px;font-weight:700;fill:var(--alert)}.small{font-size:13px;fill:var(--muted)}</style><text x="35" y="38" class="h">Low regret does not rule out collapse</text><rect x="55" y="75" width="320" height="245" class="card"/><rect x="425" y="75" width="320" height="245" class="card"/><text x="145" y="115" class="k">Step 100</text><text x="515" y="115" class="k">Step 200</text><text x="90" y="165" class="t">Mean regret</text><text x="245" y="165" class="k">3.173397</text><text x="460" y="165" class="t">Mean regret</text><text x="615" y="165" class="k">3.330709</text><rect x="80" y="195" width="270" height="95" class="accent"/><rect x="450" y="195" width="270" height="95" class="accent"/><text x="100" y="225" class="t">Dominant-action fraction</text><text x="165" y="270" class="value">0.965</text><text x="470" y="225" class="t">Dominant-action fraction</text><text x="535" y="270" class="value">0.989</text><text x="110" y="350" class="t">At step 200, 989 / 1,000 decisions select price 7.5.</text><text x="110" y="378" class="small">Behavioral concentration is reported separately from scalar regret.</text></svg>
